name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: flightlog
          POSTGRES_USER: flightlog
          POSTGRES_PASSWORD: flightlog
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U flightlog -d flightlog"
          --health-interval 5s --health-retries 10
    env:
      FLASK_DATABASE_URL: postgresql+psycopg://flightlog:flightlog@localhost:5433/flightlog
      FLASK_GITHUB_WEBHOOK_SECRET: ci-secret
      FLASK_CLAUDE_HOOK_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head
        if: hashFiles('alembic.ini') != ''
      - run: pytest
        if: hashFiles('tests/**/*.py') != ''
