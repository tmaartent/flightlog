{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<form class="login" method="post" action="{{ url_for('auth.login', next=next) }}">
  <h1>Log in</h1>
  {% if not configured %}
  <p class="notice" role="status">Login is not configured. Set <code>FLASK_SECRET_KEY</code> and <code>FLASK_ADMIN_PASSWORD_HASH</code> (made with <code>flask hash-password</code>).</p>
  {% endif %}
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required autofocus>
  </label>
  <button class="primary" type="submit">Log in</button>
</form>
{% endblock %}
