[project]
name = "flightlog"
version = "0.1.0"
description = "A flight recorder for coding agents: Claude Code hooks and GitHub webhooks in, session timelines and weekly PDF reports out."
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "flask-limiter[redis]>=4.1,<5",  # Redis for shared rate-limit counters (ADR-0017)
    "playwright>=1.65,<2",
    "python-dotenv>=1.2",
    "gunicorn>=23",  # the WSGI server in the container
    "mcp>=2.3,<3",  # the read-only MCP server (ADR-0019); 2.x renamed FastMCP to MCPServer
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-playwright>=0.10",
    "httpx>=0.28",
    "ruff>=0.17",
    "import-linter>=2.16",
    "pypdf>=7.2",  # page counts and text of the report PDF in tests
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Templates and static files are not Python modules; without this a regular (non-editable)
# install, as in the Docker image, would leave them out.
[tool.setuptools.package-data]
flightlog = ["api/templates/**/*.html", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests.util` for shared helpers and `flightlog_hook` from scripts/, also with plain `pytest`.
pythonpath = [".", "scripts"]
markers = [
    "db: needs the PostgreSQL from docker compose",
    "e2e: Playwright end-to-end test against a running app",
    "compose: smoke test against `docker compose up` (needs E2E_COMPOSE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.isort]
known-first-party = ["flightlog"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]
"scripts/**" = ["S603"]

# Layer rules, checked in CI with `lint-imports` (see docs/adr/0007-layered-architecture.md).
[tool.importlinter]
root_package = "flightlog"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: each layer only imports the layers below it"
type = "layers"
layers = [
    "flightlog.api | flightlog.infrastructure",  # siblings: the API never imports infrastructure
    "flightlog.application",
    "flightlog.contracts",
    "flightlog.domain",
]

[[tool.importlinter.contracts]]
name = "Domain, contracts and application stay free of frameworks"
type = "forbidden"
source_modules = ["flightlog.domain", "flightlog.contracts", "flightlog.application"]
forbidden_modules = ["flask", "sqlalchemy", "alembic", "psycopg"]

[[tool.importlinter.contracts]]
name = "The MCP server reads only through application queries (M5, ADR-0019)"
type = "forbidden"
source_modules = ["flightlog.api.mcp_server"]
forbidden_modules = ["flightlog.infrastructure", "sqlalchemy", "psycopg"]
