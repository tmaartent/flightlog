[project]
name = "flightlog"
version = "0.1.0"
description = "A flight recorder for coding agents: Claude Code hooks and GitHub webhooks in, session timelines and weekly PDF reports out."
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "flask-limiter>=4.1,<5",
    "playwright>=1.65,<2",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-playwright>=0.10",
    "httpx>=0.28",
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs the PostgreSQL from docker compose",
    "e2e: Playwright end-to-end test against a running app",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.isort]
known-first-party = ["flightlog"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
