# The whole stack (ADR-0017): `docker compose up -d --wait`, then http://localhost:8000.
# Secrets come from the shell or from .env in this folder (compose reads it for ${…} only).
# A missing one doesn't stop `up` (that would break `docker compose up -d db` too): the app logs
# a warning and refuses what the secret protects. Quote the password hash in .env with single
# quotes: compose reads every unquoted $ in it as the start of a variable.

x-flightlog: &flightlog
  build:
    context: .
    target: runtime
  image: flightlog:runtime
  environment:
    # Not the .env value: that one points at localhost:5433, from outside the containers.
    FLASK_DATABASE_URL: postgresql+psycopg://flightlog:flightlog@db:5432/flightlog
    FLASK_RATELIMIT_STORAGE_URI: redis://redis:6379/0
    FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
    FLASK_ADMIN_PASSWORD_HASH: ${FLASK_ADMIN_PASSWORD_HASH:-}
    FLASK_GITHUB_WEBHOOK_SECRET: ${FLASK_GITHUB_WEBHOOK_SECRET:-}
    FLASK_CLAUDE_HOOK_SECRET: ${FLASK_CLAUDE_HOOK_SECRET:-}
    # Plain http on localhost; behind a TLS proxy, leave this out and set FLASK_PROXY_COUNT.
    FLASK_SESSION_COOKIE_SECURE: ${FLASK_SESSION_COOKIE_SECURE:-false}
    FLASK_PROXY_COUNT: ${FLASK_PROXY_COUNT:-0}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: flightlog
      POSTGRES_USER: flightlog
      POSTGRES_PASSWORD: flightlog
    ports:
      # 5433 on the host, so it doesn't clash with another local PostgreSQL. Set FLIGHTLOG_DB_PORT
      # to run a second copy of the stack next to it (the smoke test does, with -p).
      - "${FLIGHTLOG_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightlog -d flightlog"]
      interval: 5s
      retries: 10

  # Rate-limit counters, shared by every gunicorn worker and kept across app restarts.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Runs once per `up` and exits; app and worker start only after it succeeded.
  migrate:
    <<: *flightlog
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *flightlog
    ports:
      - "${FLIGHTLOG_APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # The slim image has no curl; Python is there anyway.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *flightlog
    command: ["flask", "--app", "flightlog", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # SIGTERM stops the worker between jobs (api/worker.py); give the current job time.
    stop_grace_period: 30s

  # `docker compose run --rm report --week 2026-W46` writes ./reports/flightlog-2026-W46.pdf.
  report:
    <<: *flightlog
    build:
      context: .
      target: report
    image: flightlog:report
    profiles: ["tools"]
    volumes:
      - ./reports:/app/reports
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
